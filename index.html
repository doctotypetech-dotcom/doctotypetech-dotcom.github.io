<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test transfert</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #171a2e;
    --accent: #6c5ce7;
    --accent2: #00d2ff;
    --text: #e8e9f3;
    --muted: #9aa0b5;
    --ok: #00c896;
    --err: #ff5c7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #2a1e5c 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 10%, #0a4a5c 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 680px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(12px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 16px 0 6px; }
  textarea {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,92,231,0.25);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  button {
    flex: 1;
    min-width: 140px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    color: white;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: transform .15s, opacity .2s;
  }
  button.secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .ua-box {
    margin-top: 20px;
    padding: 12px 14px;
    background: rgba(0,210,255,0.07);
    border: 1px dashed rgba(0,210,255,0.3);
    border-radius: 12px;
    font-size: 0.82rem;
    color: var(--muted);
    word-break: break-all;
  }
  .ua-box strong { color: var(--accent2); }
  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    display: none;
    white-space: pre-wrap;
    font-family: ui-monospace, Menlo, monospace;
  }
  .status.ok { display: block; background: rgba(0,200,150,0.12); color: var(--ok); border: 1px solid rgba(0,200,150,0.3); }
  .status.err { display: block; background: rgba(255,92,122,0.12); color: var(--err); border: 1px solid rgba(255,92,122,0.3); }
  .status.load { display: block; background: rgba(108,92,231,0.12); color: var(--accent2); border: 1px solid rgba(108,92,231,0.3); }
  .list { margin-top: 16px; font-size: 0.85rem; }
  .list a { color: var(--accent2); text-decoration: none; }
  .list a:hover { text-decoration: underline; }
  .list li { margin: 4px 0; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Test du Worker</h1>
    <p class="sub">Vérifie que le Worker communique bien avec GitHub.</p>

    <label for="workerUrl">URL du Worker</label>
    <textarea id="workerUrl" rows="1" placeholder="https://doctotype-tech.workers.dev"></textarea>

    <div class="row">
      <button class="secondary" id="healthBtn">🩺 Health check</button>
      <button class="secondary" id="listBtn">📂 Lister</button>
    </div>

    <label for="message">Message à transférer</label>
    <textarea id="message" rows="3" placeholder="Tapez ici les infos à transférer..."></textarea>

    <div class="ua-box">
      <strong>User Agent détecté :</strong> <span id="uaText">…</span>
    </div>

    <div class="row">
      <button id="sendBtn">🚀 Envoyer sur GitHub</button>
    </div>

    <div class="status" id="status"></div>
    <ul class="list" id="list"></ul>
  </div>

<script>
(() => {
  const ua = navigator.userAgent;
  document.getElementById('uaText').textContent = ua;

  const $ = id => document.getElementById(id);
  const statusEl = $('status');
  const listEl = $('list');

  // URL du Worker : pré-remplie ou mémorisée
  const saved = localStorage.getItem('workerUrl');
  $('workerUrl').value = saved || 'https://doctotype-tech.workers.dev';
  $('workerUrl').addEventListener('change', () => {
    localStorage.setItem('workerUrl', $('workerUrl').value.trim());
  });

  function setStatus(msg, type = 'ok') {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + type;
  }

  function getWorkerUrl() {
    const u = $('workerUrl').value.trim().replace(/\/$/, '');
    if (!u) throw new Error('URL du Worker vide');
    return u;
  }

  // 🩺 Health check
  $('healthBtn').addEventListener('click', async () => {
    listEl.innerHTML = '';
    setStatus('Vérification en cours…', 'load');
    try {
      const r = await fetch(getWorkerUrl() + '/api/health');
      const data = await r.json();
      if (data.ok) {
        setStatus(
          `✅ Worker OK\n` +
          `Dépôt : ${data.repo}${data.private ? ' (privé)' : ''}\n` +
          `Statut GitHub : ${data.status}`,
          'ok'
        );
      } else {
        setStatus(`❌ ${data.message || data.error || 'Erreur inconnue'}`, 'err');
      }
    } catch (e) {
      setStatus('❌ ' + e.message, 'err');
    }
  });

  // 📂 Liste
  $('listBtn').addEventListener('click', async () => {
    listEl.innerHTML = '';
    setStatus('Chargement…', 'load');
    try {
      const r = await fetch(getWorkerUrl() + '/api/list');
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'Erreur');
      if (data.fichiers.length === 0) {
        setStatus('Aucun transfert pour le moment.', 'ok');
        return;
      }
      setStatus(`${data.fichiers.length} transfert(s) trouvé(s).`, 'ok');
      listEl.innerHTML = data.fichiers
        .map(f => `<li>📄 <a href="${f.url}" target="_blank" rel="noopener">${f.nom}</a> — ${f.taille} o</li>`)
        .join('');
    } catch (e) {
      setStatus('❌ ' + e.message, 'err');
    }
  });

  // 🚀 Envoi
  $('sendBtn').addEventListener('click', async () => {
    const message = $('message').value.trim();
    if (!message) return setStatus('Message vide.', 'err');

    $('sendBtn').disabled = true;
    setStatus('Envoi en cours…', 'load');

    const payload = {
      message,
      userAgent: ua,
      langue: navigator.language,
      plateforme: navigator.platform,
      ecran: `${screen.width}x${screen.height}`,
      referer: document.referrer || null
    };

    try {
      const r = await fetch(getWorkerUrl() + '/api/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || `HTTP ${r.status}`);
      setStatus(
        `✅ Envoyé !\n` +
        `Fichier : ${data.fichier}\n` +
        `Date : ${data.date}`,
        'ok'
      );
      $('message').value = '';
    } catch (e) {
      setStatus('❌ ' + e.message, 'err');
    } finally {
      $('sendBtn').disabled = false;
    }
  });
})();
</script>
</body>
</html>
